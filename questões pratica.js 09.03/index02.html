    <h1>Área e Perímetro do triângulo:</h1>
    <script>

let a = parseFloat(prompt("digite lado a: "));
let b = parseFloat(prompt("digite lado b: "));
let c = parseFloat(prompt("digite lado c: "));
let h = parseFloat(prompt("digite lado h: "));
let perimetro = a + b + c;
let area = (perimetro*h)/2;
console.log("o perímetro do triângulo é: " + perimetro);
console.log("a área do triângulo é: " + area);

    </script>
